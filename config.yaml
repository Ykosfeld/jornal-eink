# Configuração do Jornal Semanal — Semana 1 (só Wikipedia + capa generativa)
 
saida: ./saida            # Na Semana 3 troque por ~/biblioteca-opds
titulo: Gazeta dos Gazeteiros    # PROVISÓRIO — aparece na capa e nos metadados; trocar aqui muda tudo (não afeta o desenho da capa)
autor: Yuri Kosfeld
idioma: pt
primeira_edicao: 2026-10-02   # data da edição nº 1; a capa mostra "Nº N" (semanas desde esta data + 1). Apague a linha para omitir o número.
 
wikipedia:
  api: https://pt.wikipedia.org/w/api.php
  profundidade_max: 3     # quantos níveis de subcategoria descer
  min_caracteres: 2000    # descarta esboços
  max_caracteres: 15000   # trunca artigos muito longos (em fim de parágrafo)
  tentativas: 8           # sorteios por tema antes de desistir
  titulos_ignorados_prefixos: ["Lista de", "Listas de", "Anexo:", "Predefinição:"]


# Histórico para nunca repetir artigos entre edições (relativo à pasta do script, se não for absoluto)
historico:
  arquivo: historico.json
  esquecer_apos_semanas: 0  # artigo pode reaparecer após ~2 anos; 0 = nunca repetir


# Imagem de destaque de cada artigo (só imagens de licença livre; se não houver, o artigo segue sem imagem)
imagens:
  ativar: true
  thumb: 800            # largura pedida à Wikipedia (depois é reduzida)
  largura_max: 480      # tela do X4: 480 px de largura
  altura_max: 400       # evita imagens que ocupam a página inteira
  qualidade_jpeg: 70
  tamanho_min: 150      # ignora imagens em que largura ou altura < 150 px
 
# Cada tema tem uma lista de categorias-raiz da pt.wikipedia (sem o prefixo "Categoria:").
# A cada execução sorteia-se uma raiz e desce-se aleatoriamente pelas subcategorias até cair em um artigo.
# ATENÇÃO: nomes escritos de memória — rode `python gerador_jornal.py --validar` e ajuste o que falhar.
temas:
  Matemática:
    - Matemática
    - Álgebra
    - Geometria
    - Teoria dos números
    - Análise matemática
    - Estatística
  Física:
    - Física
    - Mecânica
    - Termodinâmica
    - Eletromagnetismo
    - Mecânica quântica
    - Relatividade
  Astronomia:
    - Astronomia
    - Planetas
    - Estrelas
    - Galáxias
    - Constelações
  Ciências:
    - Biologia
    - Química
    - Geologia
    - Ciência
  Música:
    - Música
    - Instrumentos musicais
    - Gêneros musicais
    - Teoria musical
    - Músicos vencedores do Grammy  
    - Cantores de rock dos Estados Unidos
    - Cantores de rock do Reino Unido
  Música clássica:
    - Música clássica
    - Compositores clássicos do século XX
    - Compositores clássicos do século XIX
    - Óperas
    - Sinfonias
  Aves:
    - Aves
    - Aves do Brasil
    - Ordens de aves
  Computação:
    - Computação
    - Algoritmos
    - Linguagens de programação
    - Ciência da computação
  Video games:
    - Jogos eletrônicos
    - Consoles de jogos eletrônicos
    - Gêneros de jogos eletrônicos
  Arte:
    - Arte
    - Pintura
    - Escultura
    - Movimentos artísticos
  Cinema:
    - Cinema
    - Cineastas premiados no Festival de Veneza
    - Cineastas dos Estados Unidos
    - Gêneros cinematográficos
    - Atores de cinema dos Estados Unidos
    - Atores de cinema do Reino Unido

# Notícias: feeds RSS/Atom e/ou arquivos OPML (caminho local ou URL). Pode usar os dois ao mesmo tempo.
# Caminhos relativos são lidos a partir da pasta do script.
noticias:
  ativar: true
  dias: 7               # só entradas dos últimos 7 dias
  por_feed: 2           # máx. de itens por feed
  max_total: 12         # máx. na seção (revezando entre os feeds, para nenhum dominar)
  max_caracteres: 8000
  min_caracteres: 500   # texto extraído menor que isso -> tenta o resumo do feed
  feeds:
    - {nome: "Polygon", url: "https://www.polygon.com/rss/index.xml"}
    - {nome: "Deadline", url: "https://deadline.com/feed/"}
    - {nome: "IndieWire", url: "https://www.indiewire.com/feed"}
    - {nome: "Variety", url: "https://variety.com/feed/"}
    - {nome: "Jason Schreier", url: "https://www.bloomberg.com/authors/AUvqMRVAZCw/jason-schreier.rss"}
    # - {nome: "Exemplo", url: "https://exemplo.com/feed.xml"}
    # - "https://outro.com/rss"          # sem nome: usa o título do feed
  opml: []
    # - feeds.opml
 
# Alemão: seção "Deutsch üben"
dw:
  ativar: true
  feed: http://rss.dw-world.de/xml/DKpodcast_topthemamitvokabeln_de   # confira com --validar-feeds
  quantidade: 3
  dias: 14              # janela maior: o feed não publica em dia fixo
  max_caracteres: 12000