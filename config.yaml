# Configuração do Jornal Semanal — Semana 1 (só Wikipedia + capa generativa)
 
saida: ~/biblioteca-opds            # Na Semana 3 troque por ~/biblioteca-opds
titulo: Gazeta dos Gazeteiros    # PROVISÓRIO — aparece na capa e nos metadados; trocar aqui muda tudo (não afeta o desenho da capa)
autor: Yuri Kosfeld
idioma: pt
primeira_edicao: 2026-10-02   # data da edição nº 1; a capa mostra "Nº N" (semanas desde esta data + 1). Apague a linha para omitir o número.
 
wikipedia:
  api: https://pt.wikipedia.org/w/api.php
  profundidade_max: 3     # quantos níveis de subcategoria descer
  min_caracteres: 2000    # descarta esboços
  max_caracteres: 15000   # trunca artigos muito longos (em fim de parágrafo)
  tentativas: 8           # sorteios por tema antes de desistir
  titulos_ignorados_prefixos: ["Lista de", "Listas de", "Anexo:", "Predefinição:"]
  mathml: true
  filtro_qualidade:
    ativar: true
    classe_minima: B       # classes ORES: Stub, Start, C, B, GA, FA
    timeout: 10            # segundos por avaliação remota


# Histórico para nunca repetir artigos entre edições (relativo à pasta do script, se não for absoluto)
historico:
  arquivo: historico.json
  esquecer_apos_semanas: 0  # artigo pode reaparecer após ~2 anos; 0 = nunca repetir


# Imagem de destaque de cada artigo (só imagens de licença livre; se não houver, o artigo segue sem imagem)
imagens:
  ativar: true
  thumb: 800            # largura pedida à Wikipedia (depois é reduzida)
  largura_max: 480      # tela do X4: 480 px de largura
  altura_max: 400       # evita imagens que ocupam a página inteira
  qualidade_jpeg: 70
  tamanho_min: 150      # ignora imagens em que largura ou altura < 150 px
 
# Cada tema tem uma lista de categorias-raiz da pt.wikipedia (sem o prefixo "Categoria:").
# A cada execução sorteia-se uma raiz e desce-se aleatoriamente pelas subcategorias até cair em um artigo.
# ATENÇÃO: nomes escritos de memória — rode `python gerador_jornal.py --validar` e ajuste o que falhar.
temas:
  Matemática:
    - Matemática
    - Álgebra
    - Geometria
    - Teoria dos números
    - Análise matemática
    - Estatística
  Física:
    - Física
    - Mecânica
    - Termodinâmica
    - Eletromagnetismo
    - Mecânica quântica
    - Relatividade
  Astronomia:
    - Astronomia
    - Planetas
    - Estrelas
    - Galáxias
    - Constelações
  Ciências:
    - Biologia
    - Química
    - Geologia
    - Ciência
  Música:
    - Música
    - Instrumentos musicais
    - Gêneros musicais
    - Teoria musical
    - Músicos vencedores do Grammy  
    - Cantores de rock dos Estados Unidos
    - Cantores de rock do Reino Unido
  Música clássica:
    - Música clássica
    - Compositores clássicos do século XX
    - Compositores clássicos do século XIX
    - Óperas
    - Sinfonias
  Aves:
    - Aves
    - Aves do Brasil
    - Ordens de aves
  Computação:
    - Computação
    - Algoritmos
    - Linguagens de programação
    - Ciência da computação
  Video games:
    - Jogos eletrônicos
    - Consoles de jogos eletrônicos
    - Gêneros de jogos eletrônicos
  Arte:
    - Arte
    - Pintura
    - Escultura
    - Movimentos artísticos
  Cinema:
    - Cinema
    - Cineastas premiados no Festival de Veneza
    - Cineastas dos Estados Unidos
    - Gêneros cinematográficos
    - Atores de cinema dos Estados Unidos
    - Atores de cinema do Reino Unido

# Prioriza artigos de Cinema por filmes assistidos no Letterboxd.
# A integração é opcional e não altera o sorteio quando desativada.
personalizacao_cultural:
  ativar: false
  letterboxd:
    ativar: false
    feed_url: https://letterboxd.com/ykosfeld/rss/
    janela_dias: 7
    max_filmes: 7                 # máximo de filmes recentes considerados, já ordenados
    max_creditos_por_filme: 5     # máximo de créditos da infocaixa consultados por filme

# Notícias: feeds RSS/Atom e/ou arquivos OPML (caminho local ou URL). Pode usar os dois ao mesmo tempo.
# Caminhos relativos são lidos a partir da pasta do script.
noticias:
  ativar: true
  dias: 7               # só entradas dos últimos 7 dias
  por_feed: 2           # máx. de itens por feed
  max_total: 12         # máx. na seção (revezando entre os feeds, para nenhum dominar)
  max_caracteres: 8000
  min_caracteres: 500   # texto extraído menor que isso -> tenta o resumo do feed
  feeds:
    - {nome: "Polygon", url: "https://www.polygon.com/rss/index.xml"}
    - {nome: "Deadline", url: "https://deadline.com/feed/"}
    - {nome: "IndieWire", url: "https://www.indiewire.com/feed"}
    - {nome: "Variety", url: "https://variety.com/feed/"}
    - {nome: "Jason Schreier", url: "https://www.bloomberg.com/authors/AUvqMRVAZCw/jason-schreier.rss"}
    # - {nome: "Exemplo", url: "https://exemplo.com/feed.xml"}
    # - "https://outro.com/rss"          # sem nome: usa o título do feed
  opml: []
    # - feeds.opml
 
# Alemão: seção "Deutsch üben"
dw:
  ativar: true
  feed: http://rss.dw-world.de/xml/DKpodcast_topthemamitvokabeln_de
  quantidade: 3
  dias: 14
  max_caracteres: 12000
  sufixo_url: lm       # manuscrito do áudio; apague a linha para voltar ao comportamento antigo

# Escolha do editor
escolha_do_editor:
  arquivo: escolha_do_editor.txt
  max_caracteres: 30000
  min_caracteres: 300      # abaixo disso: provável paywall
  lang: pt                 # idioma assumido se a página não declarar

# Almanaque semanal: efemérides, datas, imagem do dia e destaques da Wikipédia.
almanaque:
  ativar: true
  dias: 7
  anos_minimos_mortes: 50
  imagem: true
  imagem_proporcao_max: 2.2
  max_caracteres_extrato: 400
  destaque:
    ativar: true
    idioma: en
    maximo: 3
    verificar_pt: false
    chamadas:
      - "Importado da Wikipédia em inglês"
      - "Veio de longe (e sem pagar frete)"
      - "Passaporte carimbado"
      - "Turismo intelectual sem sair de casa"
      - "Sotaque incluso"
    chamadas_tema:
      - "Tem gringo famoso na área"
      - "Isto tem a sua cara, mesmo em inglês"
      - "Não perca! Vale o dicionário"
      - "Corra para ler: é do seu ramo"
      - "Gringo, mas da sua turma"
      - "Até o inglês se rende ao assunto"
    palavras_chave_en:
      Matemática: [mathematician, mathematics, algebra, geometry, theorem, statistician]
      Física: [physicist, physics, quantum, relativity, electromagnetism, thermodynamics]
      Astronomia: [astronomer, astronomy, astrophysicist, planet, comet, telescope, star, galaxy]
      Ciências: [scientist, biologist, chemist, geologist, naturalist, discovery]
      Música: [musician, singer, band, album, guitarist, drummer, songwriter]
      Música clássica: [composer, pianist, violinist, conductor, opera, symphony, cellist]
      Aves: [ornithologist, bird, birds, parrot, owl, eagle]
      Computação: [programmer, computing, computer, algorithm, internet, software]
      Video games: [video game, video games, console, game designer]
      Arte: [painter, sculptor, artist, architect, photographer, painting]
      Cinema: [film, films, filmmaker, director, actor, actress, screenwriter, cinema]
  feriados:
    quantidade: 5
    ancoras:
      "01-01": "Confraternização Universal"
      "04-21": "Tiradentes"
      "05-01": "Dia do Trabalho"
      "09-07": "Independência do Brasil"
      "10-12": "Nossa Senhora Aparecida / Dia das Crianças"
      "10-15": "Dia do Professor"
      "10-31": "Dia do Saci"
      "11-02": "Finados"
      "11-15": "Proclamação da República"
      "11-20": "Dia da Consciência Negra"
      "12-25": "Natal"
  palavras_penalizadas: [futebolista, politico, deputado, vereador, prefeito, candidato, pastor, apresentador, influenciador]
  palavras_chave:
    Matemática: [matematico, matematica, algebra, geometria, teorema, estatistico]
    Física: [fisico, fisica, quantica, relatividade, eletromagnetismo, termodinamica]
    Astronomia: [astronomo, astronomia, astrofisico, planeta, cometa, telescopio, estrela, galaxia]
    Ciências: [cientista, biologo, quimico, geologo, naturalista, descoberta]
    Música: [musico, cantor, cantora, banda, album, guitarrista, baterista, compositor]
    Música clássica: [compositor, pianista, violinista, maestro, opera, sinfonia, violoncelista]
    Aves: [ornitologo, ave, aves, passaro, pássaro]
    Computação: [programador, computacao, informatica, algoritmo, internet, software]
    Video games: [jogo eletronico, videogame, console, game designer]
    Arte: [pintor, pintora, escultor, escultora, artista plastico, arquiteto, fotografo]
    Cinema: [cineasta, diretor de cinema, ator, atriz, filme, roteirista, cinema]

# ---------------------------------------------------------------------------
# Layout do jornal: seções (colunas) × fontes. ACRESCENTAR ao final do config.yaml.
# Fontes válidas: qualquer chave de `temas:` + as reservadas: editor, noticias, dw, almanaque (letterboxd: futuro).
# Cada fonte só pode aparecer uma vez. Ordem das seções no epub = ordem desta lista.
# `ordem` (opcional): sequencial (padrão: todos os itens da 1ª fonte, depois da 2ª...)
#                     intercalar (round-robin entre as fontes)
# Tema que não aparece em nenhuma seção não é sorteado nem entra no histórico.
# Valide sem rede com:  python main.py --validar-layout
# ---------------------------------------------------------------------------
# Padrão (equivalente ao comportamento anterior). Sem esta chave, o código usa o mesmo layout em memória.
#secoes:
#  - nome: Escolha do Editor
#    fontes: [editor]
#  - nome: Notícias
#    fontes: [noticias]
#  - nome: Curiosidades
#    fontes: [Matemática, Física, Astronomia, Ciências, Música, Música clássica, Aves, Computação, Video games, Arte, Cinema]
#  - nome: Deutsch üben
#    fontes: [dw]
 
# Exemplo de layout por assunto (troque pelo bloco acima para usar):
secoes:
   - nome: Almanaque
     fontes: [almanaque]
   - nome: Escolha do Editor
     fontes: [editor]
   - nome: Atualidades
     fontes: [noticias]
   - nome: Cultura
     fontes: [Música, Música clássica, Cinema, Arte]
     ordem: intercalar
   - nome: Ciência
     fontes: [Matemática, Física, Astronomia, Ciências, Aves]
   - nome: Tecnologia
     fontes: [Computação, Video games]
   - nome: Deutsch üben
     fontes: [dw]
 
# Relatório JSON de cada edição (seções, itens por fonte, fontes sem item).
# Fica FORA de `saida` por padrão, para não aparecer no catálogo OPDS. Caminho relativo = raiz do repo.
relatorio:
  ativar: true
  pasta: relatorios